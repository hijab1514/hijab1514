<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hijab Fatima README Preview</title>
  <style>
    body { margin: 0; padding: 24px; background: #0a0f1d; color: #f5f6f8; font-family: Arial, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; }
    h1 { margin-bottom: 12px; }
    p { color: #b9c2d9; }
    img { width: 100%; display: block; margin: 18px 0; border-radius: 16px; }
    .row { display:grid; grid-template-columns:1fr; gap:18px; }
    @media (max-width: 680px){ body{padding:12px;} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>README asset preview</h1>
    <p>This page previews the SVGs as <code>&lt;img&gt;</code> elements, close to how GitHub README images are rendered.</p>
    <div class="row">
      <img src="./assets/hero.svg" alt="hero" />
      <img src="./assets/about-life.svg" alt="about life" />
      <img src="./assets/stack.svg" alt="stack" />
      <img src="./assets/id-dashboard.svg" alt="id dashboard" />
      <img src="./assets/connect.svg" alt="connect" />
    </div>
  </div>
</body>
</html>
